name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm prune --omit=dev

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          if [ -z "${VPS_HOST}" ] || [ -z "${VPS_USER}" ] || [ -z "${VPS_SSH_KEY}" ]; then
            echo "VPS_HOST, VPS_USER, and VPS_SSH_KEY must be set."
            exit 1
          fi

          PORT="$(printf '%s' "${VPS_PORT:-22}" | tr -d '[:space:]')"
          if [ -z "$PORT" ]; then
            PORT=22
          fi
          if ! [[ "$PORT" =~ ^[0-9]+$ ]]; then
            echo "VPS_PORT must be a number such as 22. Delete that secret to use port 22."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" | sed -e 's/\r$//' -e 's/\\n/\n/g' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          cat > ~/.ssh/config << EOF
          Host vps
            HostName ${VPS_HOST}
            User ${VPS_USER}
            Port ${PORT}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            AddressFamily inet
            ConnectTimeout 20
          EOF
          chmod 600 ~/.ssh/config

          echo "Checking SSH to port ${PORT}..."
          ssh -o BatchMode=yes vps "echo SSH connection ok"

      - name: Upload project
        run: |
          rsync -az --delete \
            -e ssh \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude 'uploads/' \
            ./ "vps:/var/www/fasilkenema/"

      - name: Restart app
        run: |
          ssh vps "bash /var/www/fasilkenema/scripts/deploy.sh"
